[package]
name = "linework-mac"
version = "1.8.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "linework_mac"

[[bin]]
name = "Linework"
path = "src/main.rs"

# The application belongs to the main thread, so its test is a program of its own.
[[test]]
name = "first_window"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
linework-editor = { path = "../editor" }
linework-storage = { path = "../storage" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[profile.release]
lto = "thin"
strip = "symbols"
