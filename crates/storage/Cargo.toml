[package]
name = "linework-storage"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
encoding_rs = "0.8"
chardetng = "0.1.17"
memchr = "2.7"
regex = "1.11"
regex-syntax = "0.8"
regex-cursor = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
tempfile = "3.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_SystemServices"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
