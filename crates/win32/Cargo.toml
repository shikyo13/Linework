[package]
name = "linework-win32"
version = "1.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The Windows calls Linework's front end uses, carried out with AppKit on macOS."

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-text = "0.3"

# Drawing is checked by a program that draws into an image and reads it back.
[[test]]
name = "drawing"
harness = false
