[package]
name = "linework-search"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Linework's own search over folders: walking, ignore rules, matching"

[workspace]

[dependencies]
memchr = "2.7"
regex = "1.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading"] }
