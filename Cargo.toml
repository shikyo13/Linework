[package]
name = "linework"
version = "1.13.2"
edition = "2024"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
linework-storage = { path = "crates/storage" }
linework-editor = { path = "crates/editor" }
linework-project = { path = "crates/project" }
linework-search = { path = "crates/search" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
memchr = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
csv = "1.4"
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_DirectComposition", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }
percent-encoding = "2.3"
imara-diff = { version = "0.2", default-features = false }
tempfile = "3"
raw-window-handle = "0.6"
rfd = { version = "0.17", features = ["common-controls-v6"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation","Win32_UI_WindowsAndMessaging","Win32_UI_Accessibility","Win32_Graphics_Gdi","Win32_Graphics_GdiPlus","Win32_Graphics_Dwm","Win32_UI_Input_KeyboardAndMouse","Win32_UI_Controls","Win32_UI_Controls_Dialogs","Win32_UI_Shell","Win32_System_LibraryLoader","Win32_UI_HiDpi","Win32_System_Com","Win32_System_DataExchange","Win32_System_Threading","Win32_Security","Win32_System_Memory","Win32_System_SystemInformation","Win32_System_WindowsProgramming","Win32_Storage_FileSystem"] }
[build-dependencies]
winresource = "0.1"
[profile.release]
lto = "thin"
strip = "symbols"

